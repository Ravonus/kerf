# The prebuilt compiler packages and the WASM build, one job per platform. It stops at artifacts: nothing here publishes.
# nightly.yml calls it with a version and a commit, then publishes what it built. Locally the same
# work is `node packages/core/scripts/build-platform.mjs --target all`, which cross-builds with cargo-zigbuild and
# cargo-xwin; each job below calls that script with one target.
name: compiler-release
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref: { type: string, required: false, default: '' }
      version: { type: string, required: false, default: '' }
permissions: {}
jobs:
  addon:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: darwin-arm64, target: aarch64-apple-darwin, os: macos-latest }
          - { name: darwin-x64, target: x86_64-apple-darwin, os: macos-latest }
          - { name: linux-x64-gnu, target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { name: linux-arm64-gnu, target: aarch64-unknown-linux-gnu, os: ubuntu-latest, cross: zigbuild }
          - { name: linux-x64-musl, target: x86_64-unknown-linux-musl, os: ubuntu-latest, cross: zigbuild }
          - { name: linux-arm64-musl, target: aarch64-unknown-linux-musl, os: ubuntu-latest, cross: zigbuild }
          - { name: win32-x64, target: x86_64-pc-windows-msvc, os: windows-latest }
          # win32-arm64 isn't built: it has never been published (Windows on ARM runs the WASM build), and its cross
          # build needs cargo-xwin, which the Windows runner doesn't have
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: '${{ inputs.ref }}' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 26 }
      - run: rustup target add ${{ matrix.target }}
        working-directory: crates/weft-compiler
      - if: matrix.cross == 'zigbuild'
        run: |
          python3 -m pip install ziglang
          cargo install cargo-zigbuild --locked
      # the platform package takes the core's version as it's written
      - if: inputs.version != ''
        run: node scripts/set-version.mjs ${{ inputs.version }}
      - run: node packages/core/scripts/build-platform.mjs --target ${{ matrix.name }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: packages/core/dist/platform/${{ matrix.name }}
  wasm:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: '${{ inputs.ref }}' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 26 }
      - run: node packages/core/scripts/build-wasm.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wasm
          path: packages/core/native/weft-compiler.wasm*
  verify:
    permissions:
      contents: read
    needs: [addon, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: '${{ inputs.ref }}' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 26 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: artifacts }
      - if: inputs.version != ''
        run: node scripts/set-version.mjs ${{ inputs.version }}
      - run: |
          mkdir -p packages/core/native packages/core/dist/platform
          cp artifacts/wasm/* packages/core/native/
          for d in artifacts/*; do [ "$d" = artifacts/wasm ] || cp -r "$d" packages/core/dist/platform/; done
          node packages/core/scripts/build-platform.mjs --verify --skip win32-arm64
