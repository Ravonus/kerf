# The same app on Node, Bun and Deno (research 28 §5). The repo has no CI yet: this is here for when it does, and
# `packages/start/scripts/runtime-matrix.mjs` run locally is the gate until then.
name: runtime-matrix
on:
  pull_request:
    paths: ['packages/start/**', 'packages/create-weft/**', 'packages/cli/**', 'packages/weft/**']
  workflow_dispatch:
jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26 }
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the packages
        run: |
          (cd packages/weft && npm ci && npm run build:native)
          for p in start cli create-weft ui-core warp multiplayer; do (cd packages/$p && npm ci); done
          (cd packages/start && npx playwright-core install --with-deps chromium)
      - name: Scaffold the todo + auth app
        run: |
          node packages/create-weft/bin/create-weft.mjs "$RUNNER_TEMP/app" --db sqlite --auth --ui warp
          cd "$RUNNER_TEMP/app"
          for p in start warp cli; do npm pkg set "dependencies.@weft/$p=file:$GITHUB_WORKSPACE/packages/$p"; done
          npm pkg delete devDependencies.@weft/cli
          npm pkg set "dependencies.weft=file:$GITHUB_WORKSPACE/packages/weft"
          npm install
          npx weft db generate
      - run: node packages/start/scripts/runtime-matrix.mjs "$RUNNER_TEMP/app"
      - run: node packages/create-weft/scripts/packed.mjs "$RUNNER_TEMP/packed"
