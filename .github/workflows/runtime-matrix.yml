# Build the same scaffold for Node, Bun and Deno and run the shared end-to-end checks on each runtime.
name: runtime-matrix
on:
  pull_request:
    paths: ['packages/start/**', 'packages/create-weft/**', 'packages/cli/**', 'packages/weft/**', '.github/workflows/runtime-matrix.yml']
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - name: Install the packages
        run: |
          pnpm install --frozen-lockfile
          (cd packages/weft && pnpm run build:native)
          (cd packages/start && pnpm exec playwright-core install --with-deps chromium)
      - name: Scaffold the todo + auth app
        run: |
          node packages/create-weft/bin/create-weft.mjs "$RUNNER_TEMP/app" --db sqlite --auth --ui warp
          cd "$RUNNER_TEMP/app"
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs"
            const pkg = JSON.parse(readFileSync("package.json", "utf8"))
            for (const p of ["start", "warp", "cli"]) pkg.dependencies[`@weft-js/${p}`] = `link:${process.env.GITHUB_WORKSPACE}/packages/${p}`
            delete pkg.devDependencies["@weft-js/cli"]
            pkg.dependencies["@weft-js/core"] = `link:${process.env.GITHUB_WORKSPACE}/packages/weft`
            writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n")
          '
          cp "$GITHUB_WORKSPACE/pnpm-workspace.yaml" pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile
          pnpm exec weft db generate
      - run: node packages/start/scripts/runtime-matrix.mjs "$RUNNER_TEMP/app"
      - name: Packed gate
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          node packages/create-weft/scripts/packed.mjs "$RUNNER_TEMP/packed"
