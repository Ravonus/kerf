# Build the same scaffold for Node, Bun and Deno and run the shared end-to-end checks on each runtime.
name: runtime-matrix
on:
  pull_request:
    paths: ['packages/start/**', 'packages/create/**', 'packages/cli/**', 'packages/core/**', '.github/workflows/runtime-matrix.yml']
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  matrix:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .nvmrc }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { targets: wasm32-unknown-unknown }
      - name: Install the packages
        run: |
          pnpm install --frozen-lockfile
          (cd packages/core && pnpm run build:native)
          (cd packages/start && pnpm exec playwright-core install --with-deps chromium)
      - name: Scaffold the todo + auth app
        run: |
          node packages/create/bin/create-weft.mjs "$RUNNER_TEMP/app" --db sqlite --auth --ui warp
          cd "$RUNNER_TEMP/app"
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs"
            const pkg = JSON.parse(readFileSync("package.json", "utf8"))
            for (const p of ["start", "warp", "cli"]) pkg.dependencies[`@weft-js/${p}`] = `link:${process.env.GITHUB_WORKSPACE}/packages/${p}`
            delete pkg.devDependencies["@weft-js/cli"]
            pkg.dependencies["@weft-js/core"] = `link:${process.env.GITHUB_WORKSPACE}/packages/core`
            writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n")
          '
          cp "$GITHUB_WORKSPACE/pnpm-workspace.yaml" pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile
          pnpm exec weft db generate
      - run: node packages/start/scripts/runtime-matrix.mjs "$RUNNER_TEMP/app"
      # Apps may run on Node 24 LTS (the packages' engines say >=24), so build and serve the same app on it too.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24 }
      - name: The same app on Node 24
        run: node packages/start/scripts/runtime-matrix.mjs "$RUNNER_TEMP/app" --runtimes node
      - name: Packed gate
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          node packages/create/scripts/packed.mjs "$RUNNER_TEMP/packed"
