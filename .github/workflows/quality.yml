# Every rule on the framework's own code: `pnpm run check` does the work, so what passes here is what passes on your machine.
name: quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the commit rules read the branch's history
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: rustup show
        working-directory: crates/kerf-compiler
      - name: Install gitleaks and cargo-deny
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check
          tar xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          sudo install "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          cargo install cargo-deny --version 0.20.2 --locked
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm run setup
      - run: pnpm --filter @kerf-js/start exec playwright-core install --with-deps chromium firefox webkit
      - name: Guardrail regression tests
        run: node --test scripts/quality/*.test.mjs evals/gates/*.test.mjs
      - run: pnpm run check --require-tools
      - name: Every commit is signed off
        if: github.event_name == 'pull_request'
        run: node scripts/quality/commits.mjs --base "origin/$GITHUB_BASE_REF" --dco
