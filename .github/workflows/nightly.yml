# Every push to main that passes `quality` goes to npm under the `next` tag, as <next patch>-nightly.<date>.<run>
# (0.1.5-nightly.20261111.12); a daily run catches anything that slipped. `latest` stays the last release cut by hand.
#
#   npm i @kerf-js/start@next        try tonight's
#
# It publishes by trusted publishing: npm trusts this workflow file in this repo, so no token is stored and none can
# leak. Nothing new since the last publish, nothing published; the `nightly` git tag marks what last went out. The
# file keeps its name: npm's trust is tied to it.
name: nightly
on:
  workflow_run:
    workflows: [quality]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC: the small hours in the Americas
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if that commit already went out
        type: boolean
        default: false
permissions: {}
concurrency: { group: nightly, cancel-in-progress: false }
jobs:
  plan:
    # after quality: only a push to main that passed
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    permissions:
      actions: read # which commits passed quality
      contents: read
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.pick.outputs.go }}
      sha: ${{ steps.pick.outputs.sha }}
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, fetch-tags: true }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .nvmrc }
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          sha=$(gh run list -R "$GITHUB_REPOSITORY" -w quality -b main -e push -s success -L 1 --json headSha -q '.[0].headSha')
          last=$(git rev-parse -q --verify 'refs/tags/nightly^{commit}' || true)
          if [ -z "$sha" ]; then echo "::warning::no commit on main has passed quality"; echo go=false >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$sha" = "$last" ] && [ "$FORCE" != true ]; then echo "nothing new since the last nightly ($sha)"; echo go=false >> "$GITHUB_OUTPUT"; exit 0; fi
          git checkout -q "$sha"
          version=$(node scripts/set-version.mjs --nightly "$GITHUB_RUN_NUMBER")
          echo "publishing $sha as $version"
          { echo go=true; echo "sha=$sha"; echo "version=$version"; } >> "$GITHUB_OUTPUT"

  compiler:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/compiler-release.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
      version: ${{ needs.plan.outputs.version }}

  publish:
    needs: [plan, compiler]
    permissions:
      contents: write # the `nightly` tag
      id-token: write # trusted publishing, and the provenance attached to each package
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: '${{ needs.plan.outputs.sha }}' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .nvmrc }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kerf-js/text build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: artifacts }
      - name: Put the compilers where the release looks
        run: |
          mkdir -p packages/core/native packages/core/dist/platform
          cp artifacts/wasm/* packages/core/native/
          for d in artifacts/*; do [ "$d" = artifacts/wasm ] || cp -r "$d" packages/core/dist/platform/; done
      - run: node scripts/set-version.mjs "$VERSION"
      - run: node scripts/release.mjs --publish --no-build --ci
      - name: Mark what went out
        run: |
          git tag -f nightly "$SHA"
          git push -f origin refs/tags/nightly
      - run: echo "### $VERSION is on npm under \`next\` (from ${SHA:0:8})" >> "$GITHUB_STEP_SUMMARY"
