# Publishes every @weft-js package to npm when a `v*` tag is pushed. npm trusts this workflow directly (trusted
# publishing, OIDC), so no token and no 2FA tap: each package is linked to it once with `scripts/trust.sh`.
#
#   bump the versions on main, commit, then:  git tag v0.1.2 && git push origin v0.1.2
#
# Same steps as a local `node scripts/release.mjs --publish`: the darwin-arm64 compiler and the WASM fallback are built
# here, every other platform runs the WASM build. Versions already on npm are skipped, so a rerun is safe.
name: publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:
env:
  # The owner's rule, here too: no third-party package younger than 3 days.
  NPM_CONFIG_MIN_RELEASE_AGE: 4320
  NPM_CONFIG_MINIMUM_RELEASE_AGE: 4320
  NPM_CONFIG_IGNORE_SCRIPTS: true
jobs:
  darwin-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: rustup target add aarch64-apple-darwin
        working-directory: crates/weft-compiler
      - run: node packages/weft/scripts/build-platform.mjs --target darwin-arm64
      - uses: actions/upload-artifact@v4
        with: { name: darwin-arm64, path: packages/weft/dist/platform/darwin-arm64 }
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: rustup target add wasm32-unknown-unknown
        working-directory: crates/weft-compiler
      - run: node packages/weft/scripts/build-wasm.mjs
      - uses: actions/upload-artifact@v4
        with: { name: wasm, path: packages/weft/native/ }
  publish:
    needs: [darwin-arm64, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, registry-url: 'https://registry.npmjs.org' }
      - uses: actions/download-artifact@v4
        with: { name: wasm, path: packages/weft/native }
      - uses: actions/download-artifact@v4
        with: { name: darwin-arm64, path: packages/weft/dist/platform/darwin-arm64 }
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: packages/text
      - run: node scripts/release.mjs --no-build --publish
