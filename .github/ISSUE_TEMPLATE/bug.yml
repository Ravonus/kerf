name: Bug
description: Something doesn't work the way it should
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The smallest code or steps that show it.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: The output of `npx kerf doctor`, or your kerf, Node and OS versions.
