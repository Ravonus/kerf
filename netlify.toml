# Keep Nitro's generated functions and static assets under the Netlify base.
# From the repository root Netlify can serve the nested static output while
# missing the internal function that supplies client navigation data.
[build]
  base = "site"
  command = "pnpm -w run setup && pnpm exec kerf build --preset netlify && node scripts/verify-netlify-navigation.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "26"
