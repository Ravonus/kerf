# The compare apps install together, apart from the repo's workspace (each pins its own stack's versions).
# `@kerf-js/*` links to the repo's packages, which the root install already set up.
# Same rule as the root: nothing younger than 3 days, except our own packages.
packages:
  - '*'
  - design/*
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@kerf-js/*'
allowBuilds:
  esbuild: false
overrides:
  '@kerf-js/cli': link:../../packages/cli
  'create-kerf': link:../../packages/create-kerf
  '@kerf-js/db': link:../../packages/db
  '@kerf-js/veneer-icons': link:../../packages/veneer-icons
  '@kerf-js/multiplayer': link:../../packages/multiplayer
  '@kerf-js/pay': link:../../packages/pay
  '@kerf-js/media-ffmpeg': link:../../packages/media-ffmpeg
  '@kerf-js/media': link:../../packages/media
  '@kerf-js/keel-pixel': link:../../packages/keel-pixel
  '@kerf-js/realtime-durable-object': link:../../packages/realtime-durable-object
  '@kerf-js/realtime-livekit': link:../../packages/realtime-livekit
  '@kerf-js/realtime-nats': link:../../packages/realtime-nats
  '@kerf-js/realtime-redis': link:../../packages/realtime-redis
  '@kerf-js/realtime-socketio': link:../../packages/realtime-socketio
  '@kerf-js/realtime-webrtc': link:../../packages/realtime-webrtc
  '@kerf-js/start': link:../../packages/start
  '@kerf-js/text': link:../../packages/text
  '@kerf-js/veneer-core': link:../../packages/veneer-core
  '@kerf-js/veneer': link:../../packages/veneer
  '@kerf-js/core': link:../../packages/core
