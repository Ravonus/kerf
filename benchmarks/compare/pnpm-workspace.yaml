# The compare apps install together, apart from the repo's workspace (each pins its own stack's versions).
# `@kerf/*` links to the repo's packages, which the root install already set up.
# Same rule as the root: nothing younger than 3 days, except our own packages.
packages:
  - '*'
  - design/*
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@kerf/*'
allowBuilds:
  esbuild: false
overrides:
  '@kerf/cli': link:../../packages/cli
  'create-kerf': link:../../packages/create-kerf
  '@kerf/db': link:../../packages/db
  '@kerf/veneer-icons': link:../../packages/veneer-icons
  '@kerf/multiplayer': link:../../packages/multiplayer
  '@kerf/pay': link:../../packages/pay
  '@kerf/media-ffmpeg': link:../../packages/media-ffmpeg
  '@kerf/media': link:../../packages/media
  '@kerf/keel-pixel': link:../../packages/keel-pixel
  '@kerf/realtime-durable-object': link:../../packages/realtime-durable-object
  '@kerf/realtime-livekit': link:../../packages/realtime-livekit
  '@kerf/realtime-nats': link:../../packages/realtime-nats
  '@kerf/realtime-redis': link:../../packages/realtime-redis
  '@kerf/realtime-socketio': link:../../packages/realtime-socketio
  '@kerf/realtime-webrtc': link:../../packages/realtime-webrtc
  '@kerf/start': link:../../packages/start
  '@kerf/text': link:../../packages/text
  '@kerf/veneer-core': link:../../packages/veneer-core
  '@kerf/veneer': link:../../packages/veneer
  '@kerf/core': link:../../packages/core
