# One install for the whole repo: `pnpm install` here. Each tool (vitest, vite, typescript…) is stored once and linked
# into every package that uses it. evals/ stays out: each stack there is a stand-alone app, installed as its users would.
packages:
  - packages/*
  - site
  - benchmarks/arena

# No third-party release younger than 3 days (the owner's supply-chain rule, in minutes). It travels with the repo,
# so an install on any machine is held to it. Our own packages are exempt.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@kerf/*'

# Dependencies' install scripts don't run (as with ignore-scripts before): esbuild and workerd ship their binaries as
# optional packages, and `pnpm run setup` runs `prisma generate` itself.
allowBuilds:
  '@firebase/util': false
  '@prisma/engines': false
  esbuild: false
  prisma: false
  protobufjs: false
  workerd: false

# Keep deprecated loaders and pinned Miniflare dependencies on patched releases.
overrides:
  "@esbuild-kit/core-utils>esbuild": 0.25.0
  "miniflare>sharp": 0.35.5
  "miniflare>undici": 7.30.1
# Playwright's frozen WebKit for macOS 14 rejects one page setting the current playwright-core sends; the patch lets
# that one fail quietly, so WebKit tests run on a macOS 14 machine (the release gate's).
patchedDependencies:
  playwright-core@1.64.1: patches/playwright-core@1.64.1.patch

# nitro's dev worker imports vite but doesn't declare it, so it got whichever vite pnpm hoisted: the arena's 6.4.4,
# whose transform hook rolldown rejects ("Missing field `moduleType`"). As a peer it resolves to the app's vite.
packageExtensions:
  nitro:
    peerDependencies:
      vite: '*'
