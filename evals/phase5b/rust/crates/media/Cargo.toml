[package]
name = "media"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
weft = { path = "WEFT_CRATE", default-features = false, features = ["native"] }

[build-dependencies]
weft = { path = "WEFT_CRATE", default-features = false, features = ["build"] }

[profile.release]
lto = "fat"
codegen-units = 1

[workspace]
