[package]
name = "search"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }
kerf = { path = "KERF_CRATE" }

[build-dependencies]
kerf = { path = "KERF_CRATE", default-features = false, features = ["build"] }

[workspace]
