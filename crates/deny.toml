# cargo deny, for each crate in crates/. `npm run check` runs it.
[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
  # typify emits chrono types for a `date-time` schema, so generated contracts name it. Moving them to another
  # date crate changes every app's generated Rust; until then the advisory (unmaintained, no known flaw) is accepted.
  { id = "RUSTSEC-2026-0543", reason = "generated contract types use chrono through typify" },
]

[licenses]
confidence-threshold = 0.9
allow = ["MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "CDLA-Permissive-2.0"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
