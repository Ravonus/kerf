[package]
name = "weft-compiler"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false
description = "weft's TSX compiler (Phase 1 spike): a weft pre-pass and diagnostics on Oxc, feeding Solid 2's DOM back end"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Node-API binding (`transform(source, optionsJson) -> resultJson`). Off for the CLI and tests.
node = ["dep:napi", "dep:napi-derive"]

[dependencies]
oxc_allocator = "0.144"
oxc_ast = "0.144"
oxc_ast_visit = "0.144"
oxc_codegen = "0.144"
oxc_parser = "0.144"
oxc_semantic = "0.144"
oxc_sourcemap = "8"
oxc_span = "0.144"
oxc_syntax = "0.144"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
napi = { version = "3.12", default-features = false, features = ["napi4"], optional = true }
napi-derive = { version = "3.6", optional = true }

[build-dependencies]
napi-build = "2.4"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
# Pedantic lints that cost more than they catch here. Byte offsets are u32 by Oxc's design; the rest are taste.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
