[package]
name = "kerf"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "The Rust side of kerf's remote() and native(): generated types from .kerf/contract.json, Ctx, the signed envelope, an axum Router, a Node-API and WASM entry"

[features]
default = ["server"]
# What generated code needs on any target.
core = ["dep:chrono", "dep:regress", "dep:serde", "dep:serde_json", "dep:uuid"]
# What a sidecar links.
server = ["core", "dep:axum", "dep:base64", "dep:hmac", "dep:sha2", "dep:tokio", "dep:tracing", "dep:tracing-subscriber"]
# What a `native()` crate links, with `default-features = false`: an addon, or a .wasm on that target. No server, no tokio.
native = ["core", "dep:napi", "dep:napi-derive"]
# `span.set_parent` from the envelope's traceparent, for an app that installs an OpenTelemetry layer.
otel = ["server", "dep:opentelemetry", "dep:tracing-opentelemetry"]
# What a sidecar's build.rs links, with `default-features = false`: nothing of the server.
build = ["dep:napi-build", "dep:prettyplease", "dep:schemars", "dep:serde_json", "dep:syn", "dep:typify"]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"], optional = true }
base64 = { version = "0.23", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"], optional = true }
hmac = { version = "0.13", optional = true }
napi-build = { version = "2.4", optional = true }
opentelemetry = { version = "0.33", optional = true }
prettyplease = { version = "0.3", optional = true }
regress = { version = "0.11", optional = true }
schemars = { version = "0.8.22", optional = true } # the version typify reads
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.11", optional = true }
syn = { version = "3", features = ["full"], optional = true }
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread", "signal", "time"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-opentelemetry = { version = "0.34", optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt"], optional = true }
typify = { version = "0.8.0", optional = true }
uuid = { version = "1", features = ["serde"], optional = true }

# Not on wasm: there the crate exports a small ABI of its own (src/native.rs).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
napi = { version = "3.12", default-features = false, features = ["dyn-symbols", "napi4"], optional = true }
napi-derive = { version = "3.6", optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lib]
doctest = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
# Pedantic lints that cost more than they catch here. Byte offsets are u32 by Oxc's design; the rest are taste.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "deny"
similar_names = "allow"
struct_excessive_bools = "allow"
