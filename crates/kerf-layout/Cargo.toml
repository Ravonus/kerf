[package]
name = "kerf-layout"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Shared layout for kerf's native hosts and Node tests (Taffy flexbox behind a C ABI)"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
taffy = { version = "0.15", default-features = false, features = ["std", "flexbox", "content_size", "taffy_tree"] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
# Pedantic lints that cost more than they catch here. Byte offsets are u32 by Oxc's design; the rest are taste.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "deny"
similar_names = "allow"
struct_excessive_bools = "allow"
